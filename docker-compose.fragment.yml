# Фрагмент для добавления в /opt/stalwart-core/docker-compose.yml
# на серверах почты (например mail.szma-inform.ru)

services:
  # ========== CORPORATE FILE SHARE ==========
  file-server:
    image: git.szma-inform.ru/mail.local/file-server:latest
    container_name: file-server
    restart: unless-stopped
    environment:
      - PUBLIC_BASE_URL=https://mail.${DOMAIN}
      - URL_PREFIX=/file-server
      - DEFAULT_TTL_DAYS=28
      - MAX_TTL_DAYS=28
      - MAX_FILE_SIZE_MB=10240
    volumes:
      - file_server_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.files.rule=Host(`mail.${DOMAIN}`) && PathPrefix(`/file-server`)"
      - "traefik.http.routers.files.entrypoints=websecure"
      - "traefik.http.routers.files.tls=true"
      - "traefik.http.services.files.loadbalancer.server.port=8000"
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  file_server_data:
    name: file_server_data
