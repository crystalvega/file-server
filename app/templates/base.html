<!DOCTYPE html>
<html lang="{{ locale|default('en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}{{ t.page_title_default }}{% endblock %} &bull; {{ t.brand_title }}</title>
    <script>
        (function() {
            try {
                // Read the exact theme set in Bulwark Webmail (stored under 'theme-applied' or in 'theme-store')
                let bulwarkTheme = localStorage.getItem('theme-applied');
                if (!bulwarkTheme) {
                    try {
                        const store = JSON.parse(localStorage.getItem('theme-store') || '{}');
                        if (store && store.state) {
                            bulwarkTheme = store.state.resolvedTheme || (store.state.theme !== 'system' ? store.state.theme : null);
                        }
                    } catch (e) {}
                }
                const currentTheme = bulwarkTheme || localStorage.getItem('bulwark_file_theme') || 'system';
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (currentTheme === 'dark' || (currentTheme === 'system' && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            
            /* Bulwark Light Theme */
            --background: #ffffff;
            --body-bg: #f8fafc;
            --foreground: #0f172a;
            --card: #ffffff;
            --card-foreground: #0f172a;
            --card-border: #e2e8f0;
            --border: #e2e8f0;
            --input: #ffffff;
            --input-border: #e2e8f0;
            --input-focus: #185aea;
            --ring: #185aea;
            
            --primary: #185aea;
            --primary-hover: #144bc6;
            --primary-foreground: #ffffff;
            
            --secondary: #f1f5f9;
            --secondary-hover: #e2e8f0;
            --secondary-foreground: #0f172a;
            
            --muted: #f1f5f9;
            --muted-foreground: #64748b;
            
            --accent: #dbeafe;
            --accent-foreground: #1e40af;
            
            --destructive: #dc2626;
            --destructive-bg: #fef2f2;
            --destructive-border: #fecaca;
            --destructive-foreground: #dc2626;
            
            --warning: #ca8a04;
            --warning-bg: #fefce8;
            --warning-border: #fef08a;
            
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            
            --radius-sm: 6px;
            --radius: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-card: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.08);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
        }

        .dark {
            /* Bulwark Dark Theme */
            --background: #0a0a0a;
            --body-bg: #09090b;
            --foreground: #fafafa;
            --card: #141414;
            --card-foreground: #fafafa;
            --card-border: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.12);
            --input: #171717;
            --input-border: rgba(255, 255, 255, 0.18);
            --input-focus: #3b82f6;
            --ring: #3b82f6;
            
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-foreground: #ffffff;
            
            --secondary: #262626;
            --secondary-hover: #333333;
            --secondary-foreground: #fafafa;
            
            --muted: #1e1e1e;
            --muted-foreground: #a1a1aa;
            
            --accent: #1e3a8a;
            --accent-foreground: #dbeafe;
            
            --destructive: #ef4444;
            --destructive-bg: rgba(239, 68, 68, 0.15);
            --destructive-border: rgba(239, 68, 68, 0.3);
            --destructive-foreground: #fca5a5;
            
            --warning: #eab308;
            --warning-bg: rgba(234, 179, 8, 0.15);
            --warning-border: rgba(234, 179, 8, 0.3);
            
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.15);
            --success-border: rgba(34, 197, 94, 0.3);
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.4);
            --shadow-card: 0 1px 3px 0 rgb(0 0 0 / 0.5), 0 1px 2px -1px rgb(0 0 0 / 0.5);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.5);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.6), 0 4px 6px -4px rgb(0 0 0 / 0.6);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--body-bg);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Top Bar */
        .topbar {
            height: 60px;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--foreground);
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }

        .brand-logo-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: var(--primary-foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Language Switcher */
        .lang-switch {
            display: inline-flex;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2px 4px;
            gap: 2px;
            box-shadow: var(--shadow-sm);
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--muted-foreground);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 6px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
            line-height: 1;
        }
        .lang-btn:hover {
            color: var(--foreground);
            background: var(--muted);
        }
        .lang-btn.active {
            background: var(--primary);
            color: var(--primary-foreground);
        }

        /* Theme Switcher */
        .theme-switch {
            display: inline-flex;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 3px;
            gap: 2px;
            box-shadow: var(--shadow-sm);
        }

        .theme-btn {
            background: transparent;
            border: none;
            color: var(--muted-foreground);
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .theme-btn:hover {
            color: var(--foreground);
            background: var(--muted);
        }

        .theme-btn.active {
            background: var(--primary);
            color: var(--primary-foreground);
        }

        /* Main Container */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 520px;
            padding: 32px;
            text-align: center;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .card-header {
            margin-bottom: 24px;
        }

        .card-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 16px auto;
            border-radius: var(--radius-lg);
            background: var(--accent);
            color: var(--accent-foreground);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--card-foreground);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .card-subtitle {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            line-height: 1.45;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: var(--radius);
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.15s ease;
            outline: none;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--secondary-foreground);
            border-color: var(--border);
        }
        .btn-secondary:hover {
            background: var(--secondary-hover);
        }

        .btn-block {
            width: 100%;
        }

        .btn-lg {
            padding: 12px 24px;
            font-size: 0.95rem;
        }

        /* Alerts & Badges */
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .alert-danger {
            background: var(--destructive-bg);
            border: 1px solid var(--destructive-border);
            color: var(--destructive-foreground);
        }

        .alert-info {
            background: var(--accent);
            border: 1px solid var(--border);
            color: var(--accent-foreground);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
        }

        .badge-warning {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: var(--muted-foreground);
            font-size: 0.775rem;
            border-top: 1px solid var(--border);
            background: var(--background);
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <a href="{{ prefix }}/" class="brand-link">
            <div class="brand-logo-icon">B</div>
            <span>{{ t.brand_title }}</span>
        </a>

        <div class="topbar-actions">
            <!-- Language Switch: EN / RU -->
            <div class="lang-switch" role="group" aria-label="{{ t.lang_label }}">
                <button type="button" class="lang-btn {% if locale == 'en' %}active{% endif %}" onclick="setLanguage('en')">EN</button>
                <span style="color: var(--card-border); font-size: 0.75rem;">|</span>
                <button type="button" class="lang-btn {% if locale == 'ru' %}active{% endif %}" onclick="setLanguage('ru')">RU</button>
            </div>

            <!-- Theme Switch: Auto / Light / Dark -->
            <div class="theme-switch" role="group" aria-label="{{ t.theme_label }}">
                <button type="button" class="theme-btn" id="theme-system" title="{{ t.theme_auto }}" onclick="setTheme('system')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="14" x="2" y="3" rx="2"/>
                        <line x1="8" x2="16" y1="21" y2="21"/>
                        <line x1="12" x2="12" y1="17" y2="21"/>
                    </svg>
                </button>
                <button type="button" class="theme-btn" id="theme-light" title="{{ t.theme_light }}" onclick="setTheme('light')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2"/><path d="M12 20v2"/>
                        <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
                        <path d="M2 12h2"/><path d="M20 12h2"/>
                        <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
                    </svg>
                </button>
                <button type="button" class="theme-btn" id="theme-dark" title="{{ t.theme_dark }}" onclick="setTheme('dark')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="card">
            <div class="card-header">
                <div class="card-icon">
                    {% block icon %}
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" x2="12" y1="15" y2="3"/>
                    </svg>
                    {% endblock %}
                </div>
                <h1 class="card-title">{% block card_title %}{{ t.app_name }}{% endblock %}</h1>
                <p class="card-subtitle">{% block card_subtitle %}{{ t.app_subtitle }}{% endblock %}</p>
            </div>

            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        {{ t.footer_text }}
    </footer>

    <script>
        function updateThemeButtons(current) {
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('theme-' + current);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function setTheme(theme) {
            localStorage.setItem('bulwark_file_theme', theme);
            applyTheme(theme);
        }

        function applyTheme(theme) {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (theme === 'dark' || (theme === 'system' && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeButtons(theme);
        }

        function setLanguage(lang) {
            document.cookie = "lang=" + lang + ";path=/;max-age=31536000;SameSite=Lax";
            const url = new URL(window.location.href);
            url.searchParams.set("lang", lang);
            window.location.href = url.toString();
        }

        // Initialize theme on page load
        (function() {
            let bulwarkTheme = localStorage.getItem('theme-applied');
            if (!bulwarkTheme) {
                try {
                    const store = JSON.parse(localStorage.getItem('theme-store') || '{}');
                    if (store && store.state) {
                        bulwarkTheme = store.state.resolvedTheme || (store.state.theme !== 'system' ? store.state.theme : null);
                    }
                } catch (e) {}
            }
            const saved = bulwarkTheme || localStorage.getItem('bulwark_file_theme') || 'system';
            applyTheme(saved);

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                const current = localStorage.getItem('theme-applied') || localStorage.getItem('bulwark_file_theme') || 'system';
                if (current === 'system') {
                    applyTheme('system');
                }
            });
        })();
    </script>
</body>
</html>
